services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATA_DIR: /data
      TRUST_PROXY: "1"
    volumes:
      - mira_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10s

  web:
    build: ./frontend
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mira_data:
